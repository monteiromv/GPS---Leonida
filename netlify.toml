[build]
  publish = "dist"
  command = "powershell -ExecutionPolicy Bypass -File ./build.ps1"

[[headers]]
  for = "/*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
